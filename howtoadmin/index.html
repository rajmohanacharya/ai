<style>
:root{--bg:#E8F4F2;--surface:rgba(244,250,250,.94);--surface2:rgba(255,255,255,.78);--text:#0D1E1C;--muted:#4B6A66;--border:rgba(13,30,28,.12);--accent:#1A7A6E;--accent2:#2A9D8F;--accent-text:#fff;--danger:#9F2538;--shadow:0 24px 64px rgba(13,30,28,.13),0 2px 12px rgba(13,30,28,.06)}
html[data-theme="apple"]{--bg:#f5f5f7;--surface:#fff;--surface2:#f2f2f7;--text:#1d1d1f;--muted:#5f6368;--border:#d2d2d7;--accent:#0071e3;--accent2:#005bb5;--accent-text:#fff;--danger:#b42318;--shadow:0 18px 48px rgba(0,0,0,.09)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 Ubuntu,"Ubuntu Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:relative;isolation:isolate}html[data-theme="clearwave"] body::before,html[data-theme="clearwave"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1}html[data-theme="clearwave"] body::before{opacity:.022;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-size:128px 128px}html[data-theme="clearwave"] body::after{background:radial-gradient(ellipse at 12% 8%,rgba(91,191,181,.22),transparent 40%),radial-gradient(ellipse at 92% 88%,rgba(42,157,143,.13),transparent 44%),radial-gradient(ellipse at 52% 44%,rgba(255,255,255,.52),transparent 58%)}.shell{max-width:1050px;margin:0 auto;padding:32px 18px 30px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.top a,.top button{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:999px;padding:9px 13px;text-decoration:none;cursor:pointer;transition:transform .2s ease,border-color .2s ease}.top a:hover,.top button:hover{transform:translateY(-1px);border-color:var(--accent)}.card,#manual{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(125%);-webkit-backdrop-filter:blur(28px) saturate(125%)}.card{border-radius:26px;padding:clamp(22px,5vw,48px)}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;margin:0 0 12px}html[data-theme="clearwave"] h1{background:linear-gradient(125deg,#0D1E1C 0%,#1A7A6E 76%,#2A9D8F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:22px 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:260px;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}input:focus{outline:3px solid color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}button.primary{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 19px;font-weight:800;cursor:pointer;box-shadow:0 8px 26px rgba(26,122,110,.28);transition:transform .4s cubic-bezier(.16,1,.3,1),background .4s cubic-bezier(.16,1,.3,1),box-shadow .4s cubic-bezier(.16,1,.3,1)}button.primary:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:0 11px 32px rgba(26,122,110,.34)}html[data-theme="apple"] button.primary{background:var(--accent)}.status{margin-top:16px;color:var(--muted);white-space:pre-wrap}.error{color:var(--danger)}#manual{margin-top:24px;border-radius:22px;padding:22px;overflow:auto}#manual:empty{display:none}#manual img{max-width:100%}#manual pre{overflow:auto;background:#070a13;color:#f5f7f8;padding:16px;border-radius:14px}.hidden{display:none}.credit{text-align:center;color:var(--muted);font-size:.75rem;padding:24px 12px 0}.credit a{color:inherit}@media(max-width:620px){.top{align-items:stretch;flex-direction:column}.top a,.top button{text-align:center}input{min-width:0;width:100%}}
</style>
</head>
<body><div class="shell"><div class="top"><a href="../">Open AI</a><button id="themeButton" type="button">Apple theme</button></div><section class="card"><h1>RajAIAssist Administrator Manual</h1><p class="muted">Owner authentication required. The manual is not stored in this public page and is downloaded only after the active backend confirms owner scope.</p><div id="unlock"><label for="ownerKey">Current owner API key</label><div class="row"><input id="ownerKey" type="password" autocomplete="off" placeholder="Paste the owner key printed by rajai-colab key --owner"><button class="primary" id="unlockButton" type="button">Unlock Manual</button></div></div><div class="status" id="status">Waiting for owner authentication.</div></section><article id="manual"></article><footer class="credit">RajAIAssist v3.1.2 · Visual design adapted from <a href="https://templatemo.com/tm-622-clearwave" rel="nofollow noopener noreferrer" target="_blank">Clearwave by TemplateMo</a></footer></div>
<script>
(() => {
  "use strict";
  const statusBox = document.getElementById("status");
  const keyInput = document.getElementById("ownerKey");
  const manualBox = document.getElementById("manual");
  const config = window.RAJAI_CONFIG || {};
  const themeKey = "rajai_theme";
  const themeButton = document.getElementById("themeButton");
  const root = document.documentElement;
  const savedTheme = localStorage.getItem(themeKey);
  const normalizedTheme = (savedTheme === "garuda" || savedTheme === "lustro") ? "clearwave" : (savedTheme === "apple" || savedTheme === "clearwave" ? savedTheme : "clearwave");
  root.dataset.theme = normalizedTheme;
  if (savedTheme === "garuda" || savedTheme === "lustro") localStorage.setItem(themeKey, "clearwave");
  const refreshTheme = () => themeButton.textContent = root.dataset.theme === "apple" ? "Clearwave theme" : "Apple theme";
  themeButton.addEventListener("click", () => { root.dataset.theme = root.dataset.theme === "apple" ? "clearwave" : "apple"; localStorage.setItem(themeKey, root.dataset.theme); refreshTheme(); });
  refreshTheme();

  function signatureMessage(manifest) { return `rajai-endpoint-v1|${manifest.online ? 1 : 0}|${manifest.backend_url || ""}|${manifest.issued_at}|${manifest.expires_at}`; }
  async function hmacHex(key, message) {
    const encoder = new TextEncoder();
    const cryptoKey = await crypto.subtle.importKey("raw", encoder.encode(key), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
    const bytes = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, encoder.encode(message)));
    return Array.from(bytes, value => value.toString(16).padStart(2, "0")).join("");
  }
  async function loadManifest() {
    let response;
    if (config.endpointManifestApiUrl) {
      try {
        response = await fetch(`${config.endpointManifestApiUrl}&cache_bust=${Date.now()}`, {cache:"no-store"});
        if (response.ok) {
          const api = await response.json();
          return JSON.parse(atob(String(api.content || "").replace(/\n/g, "")));
        }
      } catch (_) {}
    }
    response = await fetch(`${config.endpointManifestFallbackUrl || "../runtime-endpoint.json"}?t=${Date.now()}`, {cache:"no-store"});
    if (!response.ok) throw new Error("The current runtime manifest is unavailable.");
    return response.json();
  }
  async function unlock() {
    manualBox.innerHTML = "";
    statusBox.className = "status";
    const key = keyInput.value.trim();
    if (!key) { statusBox.textContent = "Enter the current owner API key."; return; }
    try {
      statusBox.textContent = "Verifying the owner key and active endpoint…";
      const manifest = await loadManifest();
      if (!manifest.online || !manifest.backend_url || Number(manifest.expires_at || 0) <= Math.floor(Date.now()/1000)) throw new Error("RajAIAssist is offline. Start the AI before opening the web manual, or use rajai-colab admin-manual locally.");
      const calculated = await hmacHex(key, signatureMessage(manifest));
      const signatures = Array.isArray(manifest.signatures) ? manifest.signatures : [manifest.signature];
      if (!signatures.some(value => value === calculated)) throw new Error("Owner access required. The supplied key does not match the current runtime.");
      const response = await fetch(`${String(manifest.backend_url).replace(/\/$/, "")}/api/admin/manual`, {headers:{Authorization:`Bearer ${key}`}, cache:"no-store"});
      const contentType = response.headers.get("content-type") || "";
      if (!response.ok) {
        let message = "Owner access required.";
        if (contentType.includes("json")) { const payload = await response.json(); message = payload.error || message; }
        throw new Error(message);
      }
      manualBox.innerHTML = await response.text();
      statusBox.textContent = "Owner authentication confirmed. Manual loaded from the private runtime resource.";
      document.getElementById("unlock").classList.add("hidden");
      sessionStorage.setItem("rajai_owner_key", key);
    } catch (error) {
      statusBox.className = "status error";
      statusBox.textContent = error instanceof Error ? error.message : String(error);
    }
  }
  document.getElementById("unlockButton").addEventListener("click", unlock);
  keyInput.addEventListener("keydown", event => { if (event.key === "Enter") unlock(); });
  const remembered = sessionStorage.getItem("rajai_owner_key");
  if (remembered) { keyInput.value = remembered; unlock(); }
})();
</script></body></html>
