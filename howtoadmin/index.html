<!doctype html>
<html lang="en" data-theme="garuda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>RajAIAssist · Administrator Manual</title>
<meta name="description" content="Owner-authenticated RajAIAssist Administrator Manual loader.">
<link rel="icon" href="../favicon.svg?v=31" type="image/svg+xml" sizes="any">
<script src="../config.js"></script>
<style>
:root{--bg:#07090d;--surface:#0f141b;--surface2:#151c25;--text:#edf4f1;--muted:#a7b5b0;--border:#2a3542;--accent:#43d17f;--accent-text:#06130c;--danger:#ff6b6b;--shadow:0 18px 48px rgba(0,0,0,.28)}
html[data-theme="apple"]{--bg:#f5f5f7;--surface:#fff;--surface2:#f2f2f7;--text:#1d1d1f;--muted:#5f6368;--border:#d2d2d7;--accent:#0071e3;--accent-text:#fff;--danger:#b42318;--shadow:0 18px 48px rgba(0,0,0,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Ubuntu,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1050px;margin:0 auto;padding:32px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.top a,.top button{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:9px 12px;text-decoration:none;cursor:pointer}.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:clamp(22px,5vw,48px);box-shadow:var(--shadow)}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;margin:0 0 12px}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:22px 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:260px;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}button.primary{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.status{margin-top:16px;color:var(--muted);white-space:pre-wrap}.error{color:var(--danger)}#manual{margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;overflow:auto}#manual:empty{display:none}#manual img{max-width:100%}#manual pre{overflow:auto;background:#111820;color:#f5f7f8;padding:16px;border-radius:12px}.hidden{display:none}
</style>
</head>
<body><div class="shell"><div class="top"><a href="../">Open AI</a><button id="themeButton" type="button">Apple theme</button></div><section class="card"><h1>RajAIAssist Administrator Manual</h1><p class="muted">Owner authentication required. The manual is not stored in this public page and is downloaded only after the active backend confirms owner scope.</p><div id="unlock"><label for="ownerKey">Current owner API key</label><div class="row"><input id="ownerKey" type="password" autocomplete="off" placeholder="Paste the owner key printed by rajai-colab key --owner"><button class="primary" id="unlockButton" type="button">Unlock Manual</button></div></div><div class="status" id="status">Waiting for owner authentication.</div></section><article id="manual"></article></div>
<script>
(() => {
  "use strict";
  const statusBox = document.getElementById("status");
  const keyInput = document.getElementById("ownerKey");
  const manualBox = document.getElementById("manual");
  const config = window.RAJAI_CONFIG || {};
  const themeKey = "rajai_theme";
  const themeButton = document.getElementById("themeButton");
  const root = document.documentElement;
  const savedTheme = localStorage.getItem(themeKey);
  if (savedTheme === "apple" || savedTheme === "garuda") root.dataset.theme = savedTheme;
  const refreshTheme = () => themeButton.textContent = root.dataset.theme === "apple" ? "Garuda theme" : "Apple theme";
  themeButton.addEventListener("click", () => { root.dataset.theme = root.dataset.theme === "apple" ? "garuda" : "apple"; localStorage.setItem(themeKey, root.dataset.theme); refreshTheme(); });
  refreshTheme();

  function signatureMessage(manifest) { return `rajai-endpoint-v1|${manifest.online ? 1 : 0}|${manifest.backend_url || ""}|${manifest.issued_at}|${manifest.expires_at}`; }
  async function hmacHex(key, message) {
    const encoder = new TextEncoder();
    const cryptoKey = await crypto.subtle.importKey("raw", encoder.encode(key), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
    const bytes = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, encoder.encode(message)));
    return Array.from(bytes, value => value.toString(16).padStart(2, "0")).join("");
  }
  async function loadManifest() {
    let response;
    if (config.endpointManifestApiUrl) {
      try {
        response = await fetch(`${config.endpointManifestApiUrl}&cache_bust=${Date.now()}`, {cache:"no-store"});
        if (response.ok) {
          const api = await response.json();
          return JSON.parse(atob(String(api.content || "").replace(/\n/g, "")));
        }
      } catch (_) {}
    }
    response = await fetch(`${config.endpointManifestFallbackUrl || "../runtime-endpoint.json"}?t=${Date.now()}`, {cache:"no-store"});
    if (!response.ok) throw new Error("The current runtime manifest is unavailable.");
    return response.json();
  }
  async function unlock() {
    manualBox.innerHTML = "";
    statusBox.className = "status";
    const key = keyInput.value.trim();
    if (!key) { statusBox.textContent = "Enter the current owner API key."; return; }
    try {
      statusBox.textContent = "Verifying the owner key and active endpoint…";
      const manifest = await loadManifest();
      if (!manifest.online || !manifest.backend_url || Number(manifest.expires_at || 0) <= Math.floor(Date.now()/1000)) throw new Error("RajAIAssist is offline. Start the AI before opening the web manual, or use rajai-colab admin-manual locally.");
      const calculated = await hmacHex(key, signatureMessage(manifest));
      const signatures = Array.isArray(manifest.signatures) ? manifest.signatures : [manifest.signature];
      if (!signatures.some(value => value === calculated)) throw new Error("Owner access required. The supplied key does not match the current runtime.");
      const response = await fetch(`${String(manifest.backend_url).replace(/\/$/, "")}/api/admin/manual`, {headers:{Authorization:`Bearer ${key}`}, cache:"no-store"});
      const contentType = response.headers.get("content-type") || "";
      if (!response.ok) {
        let message = "Owner access required.";
        if (contentType.includes("json")) { const payload = await response.json(); message = payload.error || message; }
        throw new Error(message);
      }
      manualBox.innerHTML = await response.text();
      statusBox.textContent = "Owner authentication confirmed. Manual loaded from the private runtime resource.";
      document.getElementById("unlock").classList.add("hidden");
      sessionStorage.setItem("rajai_owner_key", key);
    } catch (error) {
      statusBox.className = "status error";
      statusBox.textContent = error instanceof Error ? error.message : String(error);
    }
  }
  document.getElementById("unlockButton").addEventListener("click", unlock);
  keyInput.addEventListener("keydown", event => { if (event.key === "Enter") unlock(); });
  const remembered = sessionStorage.getItem("rajai_owner_key");
  if (remembered) { keyInput.value = remembered; unlock(); }
})();
</script></body></html>
